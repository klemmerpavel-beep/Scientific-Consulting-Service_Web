# Обратный прокси перед приложением. Ставится на хосте, сертификат —
# Let's Encrypt через certbot. Приложение слушает только 127.0.0.1:3000.
#
# Строки listen [::] выключены намеренно: на сервере без IPv6 они не дают
# nginx запуститься. Если провайдер выдал адрес IPv6 — раскомментировать.

server {
    listen 80;
    # listen [::]:80;              # включить, если у сервера есть IPv6
    server_name prodisser.ru www.prodisser.ru;

    # Проверка владения доменом для выпуска сертификата
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://prodisser.ru$request_uri; }
}

# Основной домен без www: один адрес страницы — один canonical
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;  # включить, если у сервера есть IPv6
    server_name www.prodisser.ru;

    ssl_certificate     /etc/letsencrypt/live/prodisser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodisser.ru/privkey.pem;

    return 301 https://prodisser.ru$request_uri;
}

server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;  # включить, если у сервера есть IPv6
    server_name prodisser.ru;

    ssl_certificate     /etc/letsencrypt/live/prodisser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodisser.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Размер тела: формы маленькие, большего принимать незачем
    client_max_body_size 1m;

    # Статика собранного приложения кэшируется надолго: имена файлов
    # содержат хэш содержимого, устаревшего ответа не будет
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Приложение берёт адрес заявителя отсюда — он попадает в журнал согласий
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
