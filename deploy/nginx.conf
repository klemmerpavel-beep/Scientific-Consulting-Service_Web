# Обратный прокси перед приложением. Ставится на хосте, сертификат —
# Let's Encrypt через certbot. Приложение слушает только 127.0.0.1:3000.
#
# Строки listen [::] выключены намеренно: на сервере без IPv6 они не дают
# nginx запуститься. Если провайдер выдал адрес IPv6 — раскомментировать.

# Частота POST в кабинет с одного адреса. Кабинет принимает тела до 130 МБ,
# а серверное действие разбирает тело до проверки сессии: несколько
# параллельных POST по 130 МБ от анонима занимали память приложения
# (решение Р-246). Ключ пуст для прочих методов — их предел не касается.
# Файл подключается внутри http {}, где map и limit_req_zone допустимы.
map $request_method $prodisser_cabinet_post {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $prodisser_cabinet_post zone=prodisser_cabinet_post:10m rate=30r/m;

# Крупное тело (от мегабайта) принимается только от вошедшего: серверное
# действие разбирает тело раньше, чем проверяет сессию, и загрузка в
# 130 МБ от анонима занимала память приложения до всякой проверки
# (решение Р-247). Такой POST идёт через внутренний адрес с auth_request:
# nginx спрашивает приложение о сессии подзапросом без тела и только
# потом читает тело. Форма входа и прочие мелкие POST идут как прежде.
# POST без Content-Length (тело кусками, chunked, или HTTP/2 без длины)
# тоже считается крупным: длина заранее неизвестна, и без этой строки
# такое тело обходило проверку сессии (решение Р-251). Браузер длину
# формы и запроса fetch указывает, так что вход по форме не задет.
map "$request_method:$content_length" $prodisser_big_post {
    "~^POST:[0-9]{7,}$" 1;
    "~^POST:$"          1;
    default             0;
}

# Номер версии nginx не называется ни в заголовке Server, ни на страницах
# ошибок самого nginx (413, 429, 502 при перезапуске приложения): это
# лишнее знание о сервере без пользы для посетителя (решение Р-250).
# Файл подключается в контексте http, и строка действует на все server.
server_tokens off;

server {
    listen 80;
    # listen [::]:80;              # включить, если у сервера есть IPv6
    server_name prodisser.ru www.prodisser.ru;

    # Проверка владения доменом для выпуска сертификата
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://prodisser.ru$request_uri; }
}

# Основной домен без www: один адрес страницы — один canonical
server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;  # включить, если у сервера есть IPv6
    server_name www.prodisser.ru;

    ssl_certificate     /etc/letsencrypt/live/prodisser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodisser.ru/privkey.pem;

    return 301 https://prodisser.ru$request_uri;
}

server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;  # включить, если у сервера есть IPv6
    server_name prodisser.ru;

    ssl_certificate     /etc/letsencrypt/live/prodisser.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodisser.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Размер тела: формы сайта маленькие, большего принимать незачем.
    # Кабинет принимает файлы — ему предел свой, ниже (решение Р-231).
    client_max_body_size 1m;

    # Заголовки к приложению общие для всех адресов: блоки location ниже
    # своих не задают и наследуют эти.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Не $proxy_add_x_forwarded_for: тот дописывает адрес к списку,
    # присланному клиентом, и первый элемент остаётся за отправителем.
    # Приложение берёт адрес из X-Real-IP, он же тут для совместимости.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;

    # Статика собранного приложения кэшируется надолго: имена файлов
    # содержат хэш содержимого, устаревшего ответа не будет
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Свой add_header отменяет наследование серверного: без повтора
        # статика шла без HSTS (решение Р-246).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Кабинет: материал до 50 МБ, обращение — до пяти файлов по 25 МБ.
    # Предел совпадает с пределом серверных действий в next.config.mjs;
    # при меньшем nginx отвечал 413 раньше, чем приложение успевало
    # проверить размер и объяснить отказ.
    location /cabinet {
        client_max_body_size 130m;
        proxy_read_timeout 300s;
        # Тридцать POST в минуту с адреса и запас на всплеск — с большим
        # запасом для человека, который загружает файлы и пишет сообщения.
        limit_req zone=prodisser_cabinet_post burst=20 nodelay;
        limit_req_status 429;
        if ($prodisser_big_post) {
            rewrite ^ /__cabinet_upload$uri last;
        }
        proxy_pass http://127.0.0.1:3000;
    }

    # Крупная загрузка: сначала проверка сессии, затем тело (решение Р-247).
    location ^~ /__cabinet_upload/ {
        internal;
        auth_request /__cabinet_session;
        client_max_body_size 130m;
        proxy_read_timeout 300s;
        limit_req zone=prodisser_cabinet_post burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/__cabinet_upload(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /__cabinet_session {
        internal;
        # Подзапрос сверяет длину исходного тела со своим пределом: без этой
        # строки действовал бы серверный 1 МБ, и проверка отвечала бы 413.
        client_max_body_size 130m;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:3000/cabinet/api/session;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
