# Временный узел на время выпуска первого сертификата.
#
# Зачем он нужен. В deploy/nginx.conf прописаны пути к сертификату, которого
# до первого выпуска не существует, и nginx с таким файлом не запускается:
#   [emerg] cannot load certificate "/etc/letsencrypt/live/prodisser.ru/
#   fullchain.pem": No such file or directory
# А certbot, чтобы выдать сертификат, должен получить ответ по адресу
# http://prodisser.ru/.well-known/acme-challenge/… — то есть nginx уже
# должен работать. Замкнутый круг разрывается этим файлом: он поднимает
# только порт 80 и отдаёт каталог проверки, без единого упоминания SSL.
#
# Порядок применения — docs/HOSTING.md, шаг 8. После выпуска сертификата
# этот файл заменяется на deploy/nginx.conf и больше не нужен.

server {
    listen 80;
    # listen [::]:80;              # включить, если у сервера есть IPv6
    server_name prodisser.ru www.prodisser.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Пока сертификата нет, показывать сайт по незащищённому соединению
    # незачем: заявку с персональными данными по http принимать нельзя.
    location / { return 404 "Сайт готовится к запуску\n"; }
}
